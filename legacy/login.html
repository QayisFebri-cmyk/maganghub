<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MagangHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- Particles Container -->
  <div class="particles-container" id="particlesContainer"></div>

  <!-- Login Particles (explosion effect) -->
  <div class="login-particles" id="loginParticles"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div style="position: relative; width: 60px; height: 60px;">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading</div>
    </div>
  </div>

  <!-- Success Animation -->
  <div class="login-success-container" id="successContainer">
    <div class="success-checkmark"></div>
    <div class="success-text">
      <h2>Login Berhasil!</h2>
      <p id="welcomeMessage">Selamat datang di MagangHub</p>
      <p class="redirect-counter" id="redirectCounter">Mengalihkan dalam 2 detik...</p>
    </div>
  </div>

  <div class="login-page">
    <div class="login-container">
      <div class="login-logo">
        <img src="assets/images/logoism.webp" alt="Logo" class="login-logo-img">
      </div>
      <div class="login-card">
        <h2>Selamat Datang</h2>
        <p class="login-subtitle">Silakan login untuk melanjutkan</p>

        <div class="login-error" id="loginError">
          <i class="fas fa-exclamation-circle"></i>
          <span id="loginErrorMsg">Username atau password salah</span>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Username</label>
            <div class="input-wrapper">
              <i class="fas fa-user"></i>
              <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
          </div>
          <div class="form-group">
            <label><i class="fas fa-lock"></i> Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock"></i>
              <input type="password" id="password" placeholder="Masukkan password" required>
              <i class="fas fa-eye toggle-pass" id="togglePass"></i>
            </div>
          </div>
          <div class="form-options">
            <label><input type="checkbox" id="rememberMe"> Ingat saya</label>
            <a href="#">Lupa password?</a>
          </div>
          <button type="submit" class="btn-login" id="btnLogin">
            <i class="fas fa-sign-in-alt"></i> Masuk
          </button>
        </form>
        <div style="margin-top:18px;padding:12px 16px;background:rgba(0,217,255,0.05);border:1px dashed rgba(0,217,255,0.3);border-radius:10px;font-size:0.75rem;color:#9CA3AF;text-align:left;backdrop-filter:blur(10px)">
          <strong style="color:#00D9FF;display:block;margin-bottom:4px"><i class="fas fa-circle-info"></i> Akun Admin</strong>
          admin / admin123
        </div>
      </div>
      <div class="login-footer">
        <p>&copy; 2026 MagangHub. All rights reserved.</p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="data/dummy-data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script>
    DB.init();

    // ===== PARTICLE GENERATION =====
    function generateParticles() {
      const container = document.getElementById('particlesContainer');
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement('div');
        particle.className = `particle particle-${i + 1}`;
        particle.style.left = Math.random() * 100 + '%';
        particle.style.bottom = '-10px';
        container.appendChild(particle);
      }
    }

    // ===== LOGIN PARTICLE EXPLOSION =====
    function createParticleExplosion(x, y) {
      const container = document.getElementById('loginParticles');
      const particleCount = 20;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'login-particle';
        const angle = (360 / particleCount) * i;
        const velocity = 5 + Math.random() * 5;
        const tx = Math.cos(angle * Math.PI / 180) * velocity * 50;
        const ty = Math.sin(angle * Math.PI / 180) * velocity * 50;

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');

        container.appendChild(particle);
        setTimeout(() => particle.remove(), 1000);
      }
    }

    // ===== PASSWORD TOGGLE =====
    document.getElementById('togglePass').addEventListener('click', function() {
      const pass = document.getElementById('password');
      pass.type = pass.type === 'password' ? 'text' : 'password';
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });

    // ===== LOGIN FORM SUBMISSION =====
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorEl = document.getElementById('loginError');
      const msgEl = document.getElementById('loginErrorMsg');
      const form = this;

      if (!username || !password) {
        msgEl.textContent = 'Username dan password wajib diisi';
        errorEl.style.display = 'flex';
        form.classList.add('login-form-error');
        setTimeout(() => form.classList.remove('login-form-error'), 400);
        return;
      }

      // Show loading
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.classList.add('active');

      // Simulate API call
      setTimeout(() => {
        const result = Auth.login(username, password);

        if (result.success) {
          loadingOverlay.classList.remove('active');

          // Get button position for particle explosion
          const btnLogin = document.getElementById('btnLogin');
          const rect = btnLogin.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          // Create particle explosion
          createParticleExplosion(centerX, centerY);

          // Show success animation
          setTimeout(() => {
            const successContainer = document.getElementById('successContainer');
            successContainer.classList.add('active');

            // Countdown
            let countdown = 2;
            const counterEl = document.getElementById('redirectCounter');
            const interval = setInterval(() => {
              countdown--;
              counterEl.textContent = `Mengalihkan dalam ${countdown} detik...`;
              if (countdown <= 0) {
                clearInterval(interval);
                const dashboardMap = {
                  admin: 'dashboard/admin.html',
                  pembimbing: 'dashboard/pembimbing.html',
                  user: 'dashboard/user.html'
                };
                window.location.href = dashboardMap[result.role] || 'dashboard/user.html';
              }
            }, 1000);
          }, 300);
        } else {
          loadingOverlay.classList.remove('active');
          msgEl.textContent = result.message;
          errorEl.style.display = 'flex';
          form.classList.add('login-form-error');
          setTimeout(() => form.classList.remove('login-form-error'), 400);
        }
      }, 1500);
    });

    // Initialize particles on page load
    window.addEventListener('load', generateParticles);

    // Redirect if already logged in
    Auth.redirectByRole();
  </script>
</body>
</html>
