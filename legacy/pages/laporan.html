<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan - MagangHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="navbar-custom">
    <div class="navbar-left">
      <button class="nav-toggle" id="toggleSidebar" aria-label="Toggle sidebar"><i class="fas fa-bars"></i></button>
      <div class="navbar-brand"><i class="fas fa-briefcase"></i><span>MagangHub</span></div>
      <h3 style="color:#fff;font-size:0.95rem;font-weight:500;opacity:0.85">Laporan</h3>
    </div>
    <div class="navbar-right">
      <button class="nav-btn" id="darkModeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
      <div class="header-user">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info"><div class="name" id="userName">User</div><div class="role" id="userRole">-</div></div>
      </div>
    </div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand"><i class="fas fa-briefcase"></i><h2>MagangHub</h2></div>
      <nav class="sidebar-menu" id="sidebarMenu"></nav>
    </aside>

    <main class="main-content">
      <div class="page-content">
        <div class="page-header">
          <div><h1>Laporan</h1><p class="subtitle">Cetak dan export laporan magang</p></div>
        </div>

        <div class="tabel-card">
          <div class="d-flex align-center justify-between mb-4">
            <h3><i class="fas fa-tasks"></i> Laporan Jurnal Harian</h3>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline" onclick="exportAktivitasPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
              <button class="btn btn-sm btn-outline" onclick="exportAktivitasExcel()"><i class="fas fa-file-excel"></i> Excel</button>
              <button class="btn btn-sm btn-outline" onclick="printAktivitas()"><i class="fas fa-print"></i> Print</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table id="aktivitasTable">
              <thead><tr><th>Tanggal</th><th>Nama</th><th>Divisi</th><th>Jurnal</th><th>Progress</th><th>Status</th></tr></thead>
              <tbody id="laporanAktivitasBody"></tbody>
            </table>
          </div>
        </div>

        <div class="tabel-card">
          <div class="d-flex align-center justify-between mb-4">
            <h3><i class="fas fa-calendar-check"></i> Laporan Absensi</h3>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline" onclick="exportAbsensiPDF()"><i class="fas fa-file-pdf"></i> PDF</button>
              <button class="btn btn-sm btn-outline" onclick="exportAbsensiExcel()"><i class="fas fa-file-excel"></i> Excel</button>
              <button class="btn btn-sm btn-outline" onclick="printAbsensi()"><i class="fas fa-print"></i> Print</button>
            </div>
          </div>
          <div class="table-wrapper">
            <table id="absensiTable">
              <thead><tr><th>Tanggal</th><th>Nama</th><th>Jam Masuk</th><th>Jam Pulang</th><th>Durasi</th><th>Status</th></tr></thead>
              <tbody id="laporanAbsensiBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../data/dummy-data.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/absensi.js"></script>
  <script src="../js/aktivitas.js"></script>
  <script>
    DB.init();
    const session = Auth.requireAuth();
    if (session.role === 'pembimbing') window.location.href = '../dashboard/pembimbing.html';
    const currentUser = Auth.getCurrentUser();
    const isAdmin = session.role === 'admin';

    function showToast(msg, type) {
      const c = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = 'toast toast-' + type;
      t.innerHTML = '<i class="fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle') + '"></i> ' + msg;
      c.appendChild(t);
      setTimeout(() => { t.classList.add('toast-remove'); setTimeout(() => t.remove(), 300); }, 3000);
    }

    function buildSidebar() {
      const menu = document.getElementById('sidebarMenu');
      if (isAdmin) {
        menu.innerHTML = `
          <div class="sidebar-label">Menu Utama</div>
          <a href="../dashboard/admin.html" class="sidebar-item"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
          <a href="../dashboard/admin.html?page=magang" class="sidebar-item"><i class="fas fa-users"></i> <span>Peserta Magang</span></a>
          <a href="../dashboard/admin.html?page=divisi" class="sidebar-item"><i class="fas fa-building"></i> <span>Divisi</span></a>
          <a href="../dashboard/admin.html?page=pembimbing" class="sidebar-item"><i class="fas fa-chalkboard-teacher"></i> <span>Pembimbing</span></a>
          <a href="absensi.html" class="sidebar-item"><i class="fas fa-calendar-check"></i> <span>Absensi</span></a>
          <a href="aktivitas.html" class="sidebar-item"><i class="fas fa-tasks"></i> <span>Jurnal Harian</span></a>
          <a href="laporan-bulanan.html" class="sidebar-item"><i class="fas fa-file-upload"></i> <span>Laporan Bulanan</span></a>
          <a href="laporan.html" class="sidebar-item active"><i class="fas fa-file-alt"></i> <span>Laporan</span></a>
          <div class="sidebar-label">Lainnya</div>
          <a href="profil.html" class="sidebar-item"><i class="fas fa-user-cog"></i> <span>Pengaturan</span></a>
          <a href="#" class="sidebar-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>`;
      } else {
        menu.innerHTML = `
          <div class="sidebar-label">Menu</div>
          <a href="../dashboard/user.html" class="sidebar-item"><i class="fas fa-th-large"></i> <span>Dashboard</span></a>
          <a href="absensi.html" class="sidebar-item"><i class="fas fa-calendar-check"></i> <span>Absensi</span></a>
          <a href="aktivitas.html" class="sidebar-item"><i class="fas fa-tasks"></i> <span>Jurnal Harian</span></a>
          <a href="laporan-bulanan.html" class="sidebar-item"><i class="fas fa-file-upload"></i> <span>Laporan Bulanan</span></a>
          <a href="laporan.html" class="sidebar-item active"><i class="fas fa-file-alt"></i> <span>Laporan</span></a>
          <a href="profil.html" class="sidebar-item"><i class="fas fa-user"></i> <span>Profil</span></a>
          <div class="sidebar-label">Lainnya</div>
          <a href="#" class="sidebar-item logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></a>`;
      }
      document.getElementById('logoutBtn')?.addEventListener('click', (e) => { e.preventDefault(); showToast('Logout berhasil','info'); setTimeout(() => Auth.logout(), 1000); });
    }

    document.getElementById('toggleSidebar').addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      const mc = document.querySelector('.main-content');
      const overlay = document.getElementById('sidebarOverlay');
      if (window.innerWidth > 991.98) {
        sb.classList.toggle('active');
        sb.classList.toggle('expanded');
        mc.classList.toggle('shifted');
      } else {
        sb.classList.toggle('active');
        overlay.classList.toggle('active');
      }
    });
    document.getElementById('sidebarOverlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('active');
      document.getElementById('sidebarOverlay').classList.remove('active');
    });

    (function initSidebarHover() {
      const sb = document.getElementById('sidebar');
      const mc = document.querySelector('.main-content');
      let sbTimer;
      sb.addEventListener('mouseenter', () => {
        clearTimeout(sbTimer);
        if (window.innerWidth > 991.98) {
          sb.classList.add('expanded');
          mc.classList.add('shifted');
        }
      });
      sb.addEventListener('mouseleave', () => {
        if (window.innerWidth > 991.98 && !sb.classList.contains('active')) {
          sbTimer = setTimeout(() => {
            sb.classList.remove('expanded');
            mc.classList.remove('shifted');
          }, 300);
        }
      });
    })();

    document.getElementById('darkModeToggle').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) { document.documentElement.removeAttribute('data-theme'); localStorage.setItem('theme','light'); }
      else { document.documentElement.setAttribute('data-theme','dark'); localStorage.setItem('theme','dark'); }
    });
    if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark');

    if (currentUser) {
      document.getElementById('userName').textContent = currentUser.nama;
      document.getElementById('userAvatar').textContent = currentUser.nama.charAt(0);
      document.getElementById('userRole').textContent = isAdmin ? 'Administrator' : 'Peserta Magang';
    }

    function renderLaporan() {
      let aktivitas, absensi;
      if (isAdmin) {
        aktivitas = DB.get('aktivitas').sort((a,b) => b.tanggal.localeCompare(a.tanggal));
        absensi = DB.get('absensi').sort((a,b) => b.tanggal.localeCompare(a.tanggal));
      } else {
        aktivitas = AktivitasManager.getByUser(currentUser.id);
        absensi = AbsensiManager.getRiwayat(currentUser.id);
      }

      const aBody = document.getElementById('laporanAktivitasBody');
      if (!aktivitas.length) { aBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Tidak ada data</td></tr>'; }
      else {
        aBody.innerHTML = aktivitas.slice(0, 50).map(a => {
          const sc = a.status === 'disetujui' ? 'badge-success' : a.status === 'ditolak' ? 'badge-danger' : 'badge-warning';
          return `<tr><td>${a.tanggal}</td><td>${isAdmin ? DB.getNamaUser(a.userId) : currentUser.nama}</td><td>${DB.getNamaDivisi(a.divisiId)}</td><td>${a.judul}</td><td>${a.progress}%</td><td><span class="badge ${sc}">${a.status}</span></td></tr>`;
        }).join('');
      }

      const abBody = document.getElementById('laporanAbsensiBody');
      if (!absensi.length) { abBody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Tidak ada data</td></tr>'; }
      else {
        abBody.innerHTML = absensi.slice(0, 50).map(a => {
          const sc = AbsensiManager.getStatusColor(a.status);
          return `<tr><td>${a.tanggal}</td><td>${isAdmin ? DB.getNamaUser(a.userId) : currentUser.nama}</td><td>${a.jamMasuk}</td><td>${a.jamPulang}</td><td>${a.durasi}</td><td><span class="badge" style="background:${sc}22;color:${sc}">${AbsensiManager.getStatusLabel(a.status)}</span></td></tr>`;
        }).join('');
      }
    }

    function exportAktivitasPDF() {
      const w = window.open('', '_blank');
      w.document.write('<html><head><title>Laporan Aktivitas</title><style>body{font-family:Arial,sans-serif;padding:40px}h1{color:#2563EB}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #ddd}th{background:#f1f5f9;font-size:12px;text-transform:uppercase}td{font-size:13px}</style></head><body>');
      w.document.write('<h1>Laporan Aktivitas Magang</h1><p>Tanggal: ' + new Date().toLocaleDateString('id-ID') + '</p>');
      w.document.write(document.getElementById('aktivitasTable').outerHTML);
      w.document.write('</body></html>');
      w.document.close();
      w.print();
    }

    function exportAbsensiPDF() {
      const w = window.open('', '_blank');
      w.document.write('<html><head><title>Laporan Absensi</title><style>body{font-family:Arial,sans-serif;padding:40px}h1{color:#2563EB}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #ddd}th{background:#f1f5f9;font-size:12px;text-transform:uppercase}td{font-size:13px}</style></head><body>');
      w.document.write('<h1>Laporan Absensi Magang</h1><p>Tanggal: ' + new Date().toLocaleDateString('id-ID') + '</p>');
      w.document.write(document.getElementById('absensiTable').outerHTML);
      w.document.write('</body></html>');
      w.document.close();
      w.print();
    }

    function exportAktivitasExcel() {
      const table = document.getElementById('aktivitasTable');
      let csv = '\uFEFF';
      table.querySelectorAll('tr').forEach(row => {
        const cells = row.querySelectorAll('th, td');
        csv += Array.from(cells).map(c => '"' + c.textContent.trim().replace(/"/g, '""') + '"').join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'laporan-aktivitas.csv';
      a.click();
      showToast('File Excel jurnal berhasil diunduh', 'success');
    }

    function exportAbsensiExcel() {
      const table = document.getElementById('absensiTable');
      let csv = '\uFEFF';
      table.querySelectorAll('tr').forEach(row => {
        const cells = row.querySelectorAll('th, td');
        csv += Array.from(cells).map(c => '"' + c.textContent.trim().replace(/"/g, '""') + '"').join(',') + '\n';
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'laporan-absensi.csv';
      a.click();
      showToast('File Excel absensi berhasil diunduh', 'success');
    }

    function printAktivitas() { exportAktivitasPDF(); }
    function printAbsensi() { exportAbsensiPDF(); }

    buildSidebar();
    renderLaporan();
  </script>
</body>
</html>
